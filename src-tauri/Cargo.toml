[package]
name = "apostrophe"
version = "0.3.0"
description = "Clon nativo de Apostrophe para Windows (Tauri + Rust)"
authors = ["Gerardo Franco"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "apostrophe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Nucleo de dominio (hexagonal): la logica vive aca; src-tauri solo adapta (IPC).
# Activa el feature `serde` para que Stats/ReadTime crucen la frontera como JSON.
apostrophe-core = { path = "../crates/apostrophe-core", features = ["serde", "spellbook-backend"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# M2: pandoc como sidecar (externalBin) en vez del binario del sistema.
tauri-plugin-shell = "2"
# M4: dialogos nativos de abrir/guardar archivo.
tauri-plugin-dialog = "2"
# Capa B (asociacion .md): en Windows el doble-click en un .md lanza una instancia
# NUEVA con el path en argv. single-instance la intercepta y reenvia el argv a la
# instancia viva (evita ventanas duplicadas). Debe registrarse PRIMERO en el builder.
tauri-plugin-single-instance = "2"
# M8.2: recuerda tamano/posicion/maximizado/fullscreen de la ventana entre sesiones.
# Plugin oficial; auto-restaura al crear la ventana y auto-guarda al salir.
tauri-plugin-window-state = "2"
# M11.1: preferencias persistentes (settings.json en app_config_dir). Fuente unica de
# verdad de los ajustes de UI, accesible desde Rust y JS. Requiere "store:default" en
# capabilities/default.json (sin el permiso, load() falla en silencio en Tauri 2).
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M20: el SVG de las formulas viaja al webview como data URI, no como archivo.
base64 = "0.22"
# M8.4a: autosave por snapshots — id unico de sesion (ya en Cargo.lock como dep transitiva).
uuid = { version = "1", features = ["v4"] }
# M8.4a: tokio::time::sleep para el timer de autosave (runtime de Tauri ya usa tokio;
# agregamos la dep directa con el feature `time` para poder llamar sleep).
tokio = { version = "1", features = ["time"] }
notify-debouncer-full = "0.7"
