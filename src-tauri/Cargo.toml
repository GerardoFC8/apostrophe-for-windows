[package]
name = "apostrophe"
version = "0.1.0"
description = "Clon nativo de Apostrophe para Windows (Tauri + Rust)"
authors = ["Gerardo Franco"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "apostrophe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Nucleo de dominio (hexagonal): la logica vive aca; src-tauri solo adapta (IPC).
# Activa el feature `serde` para que Stats/ReadTime crucen la frontera como JSON.
apostrophe-core = { path = "../crates/apostrophe-core", features = ["serde"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# M2: pandoc como sidecar (externalBin) en vez del binario del sistema.
tauri-plugin-shell = "2"
# M4: dialogos nativos de abrir/guardar archivo.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
