<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apostrophe</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <!-- M15: la copia visible NO se escribe aquí. Cada nodo traducible lleva data-i18n
       (contenido), data-i18n-title o data-i18n-aria-label (atributos); main.ts los
       resuelve contra el catálogo de src/i18n.ts al arrancar y al cambiar de idioma.
       El atributo lang de <html> también lo fija i18n.setLocale. -->
  <body>
    <!-- M9.3: zona detectora del borde superior. En pantalla completa, al acercar el
         mouse aquí reaparece la titlebar (paridad con el GtkRevealer del upstream). -->
    <div id="fs-hover-zone" aria-hidden="true"></div>
    <header class="titlebar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>Apostrophe</span>
      <span id="doc-name" class="doc-name" data-tauri-drag-region data-i18n="doc.untitled"></span>
      <span id="status" class="status" data-tauri-drag-region></span>
      <!-- M11: menú hamburguesa. Mismo patrón de popover que .theme-select: un trigger
           (.bar-btn) que togglea un popover role=menu oculto. Abre la ventana de atajos
           y el diálogo Acerca de (ambos overlays modales más abajo). -->
      <div class="menu-select">
        <button class="bar-btn menu-trigger" id="menu-trigger" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-title="menu.open">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
            <path d="M2.5 4 H13.5 M2.5 8 H13.5 M2.5 12 H13.5" />
          </svg>
        </button>
        <div class="app-menu theme-menu" id="app-menu" role="menu" hidden>
          <!-- M16: documentos recientes. La lista la trae el backend (recent_files) ya
               filtrada de archivos borrados, y main.ts la refresca cada vez que se abre
               el menú. Va primero por ser una acción, no información. -->
          <div id="recents-group" hidden>
            <div class="menu-label" data-i18n="menu.recents"></div>
            <div id="recent-items" role="group"></div>
            <div class="menu-sep" role="separator"></div>
          </div>
          <button class="menu-item" id="menu-shortcuts" type="button" role="menuitem" aria-haspopup="dialog" aria-keyshortcuts="Control+?">
            <span data-i18n="menu.shortcuts"></span>
            <span class="menu-hint"><kbd>Ctrl</kbd>+<kbd>?</kbd></span>
          </button>
          <button class="menu-item" id="menu-about" type="button" role="menuitem" aria-haspopup="dialog">
            <span data-i18n="menu.about"></span>
          </button>
          <!-- M17: selector de tamaño de tabla. Grilla de 5x5 que se resalta al pasar el
               mouse (paridad con TableInput.ui del upstream); la etiqueta muestra "N x M"
               en vivo. Las celdas las construye main.ts. -->
          <div class="menu-sep" role="separator"></div>
          <div class="menu-label" data-i18n="menu.table"></div>
          <div class="table-picker">
            <div id="table-grid" class="table-grid" role="group"></div>
            <div id="table-size" class="table-size">&nbsp;</div>
          </div>
          <!-- Insertar imagen: abre el selector nativo y escribe `![](ruta)`. Sin atajo, la
               misma convención que la tabla — insertar va por el menú, y los atajos quedan
               para lo que transforma el texto que ya está escrito. -->
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item" id="menu-insert-image" type="button" role="menuitem">
            <span data-i18n="menu.insertImage"></span>
          </button>
          <!-- M15: selector de idioma. Los items los construye main.ts (buildLanguageMenu)
               reusando .theme-item, que ya trae el check del activo. Los nombres de idioma
               NO se traducen: cada uno va en su propio idioma, para que quien no entienda
               el idioma actual igual reconozca el suyo. -->
          <div class="menu-sep" role="separator"></div>
          <div class="menu-label" data-i18n="menu.language"></div>
          <div id="lang-items" role="group"></div>
        </div>
      </div>
      <div class="theme-select">
        <button class="bar-btn theme-trigger" id="theme-trigger" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-title="theme.open">
          <span class="theme-trigger-icon" id="theme-trigger-icon"></span>
          <span id="theme-trigger-label"></span>
          <svg class="chevron" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M2.2 3.6 L5 6.4 L7.8 3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="theme-menu" id="theme-menu" role="menu" hidden></div>
      </div>
      <!-- M13: control de vista de 3 estados (solo editor / dividido / solo vista). Ctrl+P cicla
           entre ellos; estos botones permiten el clic directo. SVG inline (sin fuente de iconos)
           coherente con el resto del chrome. El boton activo se resalta via aria-pressed (CSS). -->
      <div class="view-control" role="group" data-i18n-aria-label="view.group">
        <button class="bar-btn view-btn" data-view="editor" type="button" data-i18n-title="view.editor" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="2" width="10" height="12" rx="1.5" />
            <path d="M5.5 5.5 H10.5 M5.5 8 H10.5 M5.5 10.5 H8.5" />
          </svg>
        </button>
        <button class="bar-btn view-btn" data-view="split" type="button" data-i18n-title="view.split" aria-pressed="true">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="3" width="11" height="10" rx="1.5" />
            <path d="M8 3 V13" />
          </svg>
        </button>
        <button class="bar-btn view-btn" data-view="preview" type="button" data-i18n-title="view.preview" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.5 8 C3 4.5 6 3 8 3 C10 3 13 4.5 14.5 8 C13 11.5 10 13 8 13 C6 13 3 11.5 1.5 8 Z" />
            <circle cx="8" cy="8" r="2" />
          </svg>
        </button>
        <!-- M18: abre/cierra la vista previa en su propia ventana. Va con el control de
             vista porque es una forma más de ver el documento, no una acción sobre él.
             aria-pressed refleja si la ventana está abierta. -->
        <button class="bar-btn view-btn" id="preview-window-btn" type="button" data-i18n-title="view.detach" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="1.5" y="3.5" width="9" height="9" rx="1.5" />
            <path d="M9 3.5 V2 h5.5 v5.5 H13" />
          </svg>
        </button>
      </div>
      <button class="bar-btn" id="export-btn" type="button" data-i18n-title="export.hint" data-i18n="export.action"></button>
      <div class="window-controls">
        <button class="win-btn" id="win-min" type="button" data-i18n-aria-label="window.minimize" data-i18n-title="window.minimize">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 5 H10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <button class="win-btn" id="win-max" type="button" data-i18n-aria-label="window.maximize" data-i18n-title="window.maximize">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <button class="win-btn win-close" id="win-close" type="button" data-i18n-aria-label="window.close" data-i18n-title="window.close">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
      </div>
    </header>
    <!-- M8.4b: infobar de cambio externo. Solo visible cuando el archivo cambia en disco
         mientras hay cambios locales sin guardar. NO modal: el editor sigue activo. -->
    <div id="external-change-bar" class="external-change-bar" hidden>
      <span class="external-change-msg" data-i18n="external.message"></span>
      <div class="external-change-actions">
        <button id="reload-btn" class="bar-btn" type="button" data-i18n="external.reload"></button>
        <button id="keep-btn" class="bar-btn" type="button" data-i18n="external.keep"></button>
      </div>
    </div>
    <main class="split">
      <div id="editor" class="editor"></div>
      <!-- sandbox sin allow-same-origin: el JS del HTML generado por pandoc NO puede
           acceder a window.parent.__TAURI__ (cierra XSS via .md malicioso). allow-scripts
           deja correr MathJax. -->
      <iframe id="preview" class="preview" data-i18n-title="view.previewFrame" sandbox="allow-scripts"></iframe>
    </main>
    <!-- Los contadores los rellena updateStats (main.ts) con las formas plurales del
         catálogo; arrancan vacíos para no mostrar un idioma equivocado antes del primer
         render. -->
    <footer class="statusbar">
      <span id="stat-words"></span>
      <span id="stat-chars"></span>
      <span id="stat-sentences"></span>
      <span id="stat-paragraphs"></span>
      <span id="stat-readtime"></span>
    </footer>

    <!-- M11: overlay modal de atajos de teclado. Backdrop a pantalla completa + panel
         centrado. Se abre con Ctrl+? o desde el menú; se cierra con Esc, con clic en el
         backdrop o con el botón ×. Las teclas usan <kbd>. La lista está agrupada por
         secciones; cada atajo verificado contra los handlers de main.ts. -->
    <div id="shortcuts-overlay" class="overlay" hidden>
      <div class="overlay-backdrop"></div>
      <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="shortcuts-title">
        <header class="overlay-header">
          <h2 id="shortcuts-title" class="overlay-title" data-i18n="shortcuts.title"></h2>
          <button class="overlay-close" id="shortcuts-close" type="button" data-i18n-aria-label="common.close">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
              <path d="M1 1 L13 13 M13 1 L1 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
        </header>
        <div class="overlay-body shortcuts-body">
          <section class="shortcuts-section">
            <h3 class="shortcuts-heading" data-i18n="shortcuts.file"></h3>
            <dl class="shortcuts-list">
              <dt data-i18n="shortcuts.open"></dt><dd><kbd>Ctrl</kbd>+<kbd>O</kbd></dd>
              <dt data-i18n="shortcuts.save"></dt><dd><kbd>Ctrl</kbd>+<kbd>S</kbd></dd>
              <dt data-i18n="shortcuts.saveAs"></dt><dd><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd></dd>
              <dt data-i18n="shortcuts.newDoc"></dt><dd><kbd>Ctrl</kbd>+<kbd>N</kbd></dd>
              <dt data-i18n="shortcuts.export"></dt><dd><kbd>Ctrl</kbd>+<kbd>E</kbd></dd>
            </dl>
          </section>
          <section class="shortcuts-section">
            <h3 class="shortcuts-heading" data-i18n="shortcuts.editing"></h3>
            <dl class="shortcuts-list">
              <dt data-i18n="shortcuts.bold"></dt><dd><kbd>Ctrl</kbd>+<kbd>B</kbd></dd>
              <dt data-i18n="shortcuts.italic"></dt><dd><kbd>Ctrl</kbd>+<kbd>I</kbd></dd>
              <dt data-i18n="shortcuts.strikethrough"></dt><dd><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd></dd>
              <dt data-i18n="shortcuts.list"></dt><dd><kbd>Ctrl</kbd>+<kbd>U</kbd></dd>
              <dt data-i18n="shortcuts.alignTable"></dt><dd><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd></dd>
              <dt data-i18n="shortcuts.heading"></dt><dd><kbd>Ctrl</kbd>+<kbd>1</kbd>…<kbd>4</kbd></dd>
              <dt data-i18n="shortcuts.find"></dt><dd><kbd>Ctrl</kbd>+<kbd>F</kbd></dd>
              <dt data-i18n="shortcuts.findReplace"></dt><dd><kbd>Ctrl</kbd>+<kbd>H</kbd></dd>
              <dt data-i18n="shortcuts.undo"></dt><dd><kbd>Ctrl</kbd>+<kbd>Z</kbd></dd>
              <dt data-i18n="shortcuts.redo"></dt><dd><kbd>Ctrl</kbd>+<kbd>Y</kbd></dd>
            </dl>
          </section>
          <section class="shortcuts-section">
            <h3 class="shortcuts-heading" data-i18n="shortcuts.view"></h3>
            <dl class="shortcuts-list">
              <dt data-i18n="shortcuts.cycleView"></dt><dd><kbd>Ctrl</kbd>+<kbd>P</kbd></dd>
              <dt data-i18n="shortcuts.fullscreen"></dt><dd><kbd>F11</kbd></dd>
            </dl>
          </section>
          <section class="shortcuts-section">
            <h3 class="shortcuts-heading" data-i18n="shortcuts.writingModes"></h3>
            <dl class="shortcuts-list">
              <dt data-i18n="shortcuts.focus"></dt><dd><kbd>Ctrl</kbd>+<kbd>D</kbd></dd>
              <dt data-i18n="shortcuts.hemingway"></dt><dd><kbd>Ctrl</kbd>+<kbd>T</kbd></dd>
            </dl>
          </section>
          <section class="shortcuts-section">
            <h3 class="shortcuts-heading" data-i18n="shortcuts.spellcheck"></h3>
            <dl class="shortcuts-list">
              <dt data-i18n="shortcuts.toggleSpellcheck"></dt><dd><kbd>F7</kbd></dd>
            </dl>
          </section>
          <section class="shortcuts-section">
            <h3 class="shortcuts-heading" data-i18n="shortcuts.help"></h3>
            <dl class="shortcuts-list">
              <dt data-i18n="shortcuts.showShortcuts"></dt><dd><kbd>Ctrl</kbd>+<kbd>?</kbd></dd>
            </dl>
          </section>
        </div>
      </div>
    </div>

    <!-- M11: overlay modal Acerca de. Misma mecánica que el de atajos. La versión la
         inyecta main.ts (importada de package.json en build-time). Los enlaces externos
         los abre el plugin opener (un <a target=_blank> no abre el navegador en WebView2). -->
    <div id="about-overlay" class="overlay" hidden>
      <div class="overlay-backdrop"></div>
      <div class="overlay-panel about-panel" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <header class="overlay-header">
          <h2 id="about-title" class="overlay-title" data-i18n="about.title"></h2>
          <button class="overlay-close" id="about-close" type="button" data-i18n-aria-label="common.close">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
              <path d="M1 1 L13 13 M13 1 L1 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
        </header>
        <div class="overlay-body about-body">
          <p class="about-name" data-i18n="about.name"></p>
          <p class="about-version"><span data-i18n="about.version"></span> <span id="about-version-num">—</span></p>
          <p class="about-desc" data-i18n="about.description"></p>
          <div class="about-links">
            <a href="https://github.com/GerardoFC8/apostrophe-for-windows" id="about-link-repo" class="about-link" data-external-link data-i18n="about.repo"></a>
            <a href="https://gitlab.gnome.org/World/apostrophe" id="about-link-upstream" class="about-link" data-external-link data-i18n="about.upstream"></a>
          </div>
          <p class="about-credits" data-i18n="about.credits"></p>
        </div>
      </div>
    </div>
  </body>
</html>
