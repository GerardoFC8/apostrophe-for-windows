<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apostrophe</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- M9.3: zona detectora del borde superior. En pantalla completa, al acercar el
         mouse aquí reaparece la titlebar (paridad con el GtkRevealer del upstream). -->
    <div id="fs-hover-zone" aria-hidden="true"></div>
    <header class="titlebar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>Apostrophe</span>
      <span id="doc-name" class="doc-name" data-tauri-drag-region>Sin título</span>
      <span id="status" class="status" data-tauri-drag-region></span>
      <div class="theme-select">
        <button class="bar-btn theme-trigger" id="theme-trigger" type="button" aria-haspopup="menu" aria-expanded="false" title="Tema">
          <span class="theme-trigger-icon" id="theme-trigger-icon"></span>
          <span id="theme-trigger-label">Claro</span>
          <svg class="chevron" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M2.2 3.6 L5 6.4 L7.8 3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="theme-menu" id="theme-menu" role="menu" hidden></div>
      </div>
      <!-- M13: control de vista de 3 estados (solo editor / dividido / solo vista). Ctrl+P cicla
           entre ellos; estos botones permiten el clic directo. SVG inline (sin fuente de iconos)
           coherente con el resto del chrome. El boton activo se resalta via aria-pressed (CSS). -->
      <div class="view-control" role="group" aria-label="Vista">
        <button class="bar-btn view-btn" data-view="editor" type="button" title="Solo editor" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="2" width="10" height="12" rx="1.5" />
            <path d="M5.5 5.5 H10.5 M5.5 8 H10.5 M5.5 10.5 H8.5" />
          </svg>
        </button>
        <button class="bar-btn view-btn" data-view="split" type="button" title="Dividido (editor y vista)" aria-pressed="true">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="3" width="11" height="10" rx="1.5" />
            <path d="M8 3 V13" />
          </svg>
        </button>
        <button class="bar-btn view-btn" data-view="preview" type="button" title="Solo vista — Ctrl+P cicla" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.5 8 C3 4.5 6 3 8 3 C10 3 13 4.5 14.5 8 C13 11.5 10 13 8 13 C6 13 3 11.5 1.5 8 Z" />
            <circle cx="8" cy="8" r="2" />
          </svg>
        </button>
      </div>
      <button class="bar-btn" id="export-btn" type="button" title="Exportar a HTML (Ctrl+E)">Exportar</button>
      <div class="window-controls">
        <button class="win-btn" id="win-min" type="button" aria-label="Minimizar" title="Minimizar">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 5 H10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <button class="win-btn" id="win-max" type="button" aria-label="Maximizar" title="Maximizar">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <button class="win-btn win-close" id="win-close" type="button" aria-label="Cerrar" title="Cerrar">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
      </div>
    </header>
    <!-- M8.4b: infobar de cambio externo. Solo visible cuando el archivo cambia en disco
         mientras hay cambios locales sin guardar. NO modal: el editor sigue activo. -->
    <div id="external-change-bar" class="external-change-bar" hidden>
      <span class="external-change-msg">El archivo cambió en disco.</span>
      <div class="external-change-actions">
        <button id="reload-btn" class="bar-btn" type="button">Recargar y perder mis cambios</button>
        <button id="keep-btn" class="bar-btn" type="button">Mantener mis cambios</button>
      </div>
    </div>
    <main class="split">
      <div id="editor" class="editor"></div>
      <!-- sandbox sin allow-same-origin: el JS del HTML generado por pandoc NO puede
           acceder a window.parent.__TAURI__ (cierra XSS via .md malicioso). allow-scripts
           deja correr MathJax. -->
      <iframe id="preview" class="preview" title="preview" sandbox="allow-scripts"></iframe>
    </main>
    <footer class="statusbar">
      <span id="stat-words">0 palabras</span>
      <span id="stat-chars">0 caracteres</span>
      <span id="stat-sentences">0 oraciones</span>
      <span id="stat-paragraphs">0 párrafos</span>
      <span id="stat-readtime">0 s de lectura</span>
    </footer>
  </body>
</html>
