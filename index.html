<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apostrophe</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="topbar">
      <span class="brand">Apostrophe · spike: preview + stats</span>
      <span id="status" class="status">—</span>
    </header>
    <main class="split">
      <div id="editor" class="editor"></div>
      <iframe id="preview" class="preview" title="preview"></iframe>
    </main>
    <footer class="statusbar">
      <span id="stat-words">0 palabras</span>
      <span id="stat-chars">0 caracteres</span>
      <span id="stat-sentences">0 oraciones</span>
      <span id="stat-paragraphs">0 párrafos</span>
      <span id="stat-readtime">0 s de lectura</span>
    </footer>
  </body>
</html>
