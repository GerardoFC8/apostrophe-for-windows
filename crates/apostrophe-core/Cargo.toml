[package]
name = "apostrophe-core"
version = "0.1.0"
edition = "2021"
description = "Nucleo de dominio puro de Apostrophe (hexagonal, ADR-0001): stats, parser de markup, conversion. Sin dependencias de UI/Tauri."
authors = ["Gerardo Franco"]

[dependencies]
# `regex` (crate de BurntSushi, tiempo lineal garantizado) para WORDS y SENTENCES,
# que NO usan lookaround y portan directo. CHARACTERS y PARAGRAPHS se implementan
# imperativamente (usan lookahead que este crate no soporta; ver docs/upstream-reference).
regex = "1"
# fancy-regex: motor backtracking (lookbehind/lookahead/backreferences) para portar
# 1:1 los regex de markup de Apostrophe; el crate `regex` no los soporta. Mismo perfil
# que el modulo `regex` de Python del upstream. Riesgo ReDoS mitigado off-thread (ADR).
fancy-regex = "0.14"
# serde OPCIONAL: el dominio es puro por defecto (no lo arrastra). Solo el adaptador
# (src-tauri) activa el feature `serde` para serializar Stats/ReadTime al cruzar el IPC.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
# Para los tests del dominio. Candidato cuando haya casos parametrizados: rstest.
